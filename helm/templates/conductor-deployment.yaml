apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: conductor
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: debezium-platform
{{ include "common.labels" . | indent 4 }}
  name: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductor
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/name: conductor
    spec:
      serviceAccountName: conductor-service-account
      containers:
        - name: conductor
          image: {{ .Values.conductor.image }}
          imagePullPolicy: {{ .Values.conductor.imagePullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
{{- with .Values.conductor.extraVolumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
{{- end }}
          env:
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "debezium-platform.secretName" . }}
                  key: password
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "debezium-platform.secretName" . }}
                  key: username
            - name: CONDUCTOR_WATCHER_OFFSET_STORAGE_TYPE
              value: io.debezium.storage.configmap.ConfigMapOffsetStore
            - name: CONDUCTOR_WATCHER_OFFSET_STORAGE_CONFIG_CONFIGMAP_NAME
              value: {{ include "debezium-platform.offsetConfigMapName" . }}
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: {{ required "A valid domain URL required!" (include "debezium-platform.domainUrl" .) }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:5432/{{ .Values.database.name }}"
            - name: QUARKUS_KUBERNETES_CLIENT_NAMESPACE
              value: {{ .Release.Namespace }}
{{- if and .Values.conductor.descriptors .Values.conductor.descriptors.official .Values.conductor.descriptors.official.enabled }}
            # ORAS download mode
            - name: CONDUCTOR_DESCRIPTORS_VOLUME_SOURCE
              value: "false"
            - name: CONDUCTOR_DESCRIPTORS_PATH
              value: {{ .Values.conductor.descriptors.official.mountPath }}
            - name: CONDUCTOR_DESCRIPTORS_IMAGE_REGISTRY
              value: {{ .Values.conductor.descriptors.official.registry }}
            - name: CONDUCTOR_DESCRIPTORS_IMAGE_NAME
              value: {{ .Values.conductor.descriptors.official.image }}
            - name: CONDUCTOR_DESCRIPTORS_IMAGE_TAG
              value: {{ .Values.conductor.descriptors.official.tag }}
{{- end }}
{{- if .Values.server.image }}
            - name: PIPELINE_SERVER_IMAGE
              value: {{ .Values.server.image }}
{{- end }}
            - name: PIPELINE_HEALTH_LIVENESS_INITIAL_DELAY_SECONDS
              value: {{ .Values.pipeline.health.liveness.initialDelaySeconds | quote }}
            - name: PIPELINE_HEALTH_LIVENESS_PERIOD_SECONDS
              value: {{ .Values.pipeline.health.liveness.periodSeconds | quote }}
            - name: PIPELINE_HEALTH_LIVENESS_TIMEOUT_SECONDS
              value: {{ .Values.pipeline.health.liveness.timeoutSeconds | quote }}
            - name: PIPELINE_HEALTH_LIVENESS_FAILURE_THRESHOLD
              value: {{ .Values.pipeline.health.liveness.failureThreshold | quote }}
            - name: PIPELINE_HEALTH_READINESS_INITIAL_DELAY_SECONDS
              value: {{ .Values.pipeline.health.readiness.initialDelaySeconds | quote }}
            - name: PIPELINE_HEALTH_READINESS_PERIOD_SECONDS
              value: {{ .Values.pipeline.health.readiness.periodSeconds | quote }}
            - name: PIPELINE_HEALTH_READINESS_TIMEOUT_SECONDS
              value: {{ .Values.pipeline.health.readiness.timeoutSeconds | quote }}
            - name: PIPELINE_HEALTH_READINESS_FAILURE_THRESHOLD
              value: {{ .Values.pipeline.health.readiness.failureThreshold | quote }}
{{- if .Values.monitoring.otel.enabled }}
            - name: PIPELINE_MONITORING_OTEL_ENABLED
              value: "true"
            - name: PIPELINE_MONITORING_OTEL_ENDPOINT
              value: {{ include "debezium-platform.otelCollectorEndpoint" . }}
            - name: PIPELINE_MONITORING_OTEL_JMX_INTERVAL_MS
              value: {{ .Values.monitoring.otel.jmxIntervalMs | quote }}
            - name: PIPELINE_MONITORING_OTEL_METRIC_EXPORT_INTERVAL_MS
              value: {{ .Values.monitoring.otel.metricExportIntervalMs | quote }}
            - name: MONITORING_PROMETHEUS_URL
              value: {{ include "debezium-platform.prometheusUrl" . }}
            - name: QUARKUS_OTEL_METRICS_ENABLED
              value: "true"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "debezium-platform.otelCollectorEndpoint" . }}
{{- end }}
{{- if .Values.monitoring.panels.additionalPanelsPath }}
            - name: MONITORING_PANELS_PATH
              value: {{ .Values.monitoring.panels.additionalPanelsPath | quote }}
{{- end }}
            - name: MONITORING_PANELS_REFRESH_INTERVAL
              value: {{ .Values.monitoring.panels.refreshInterval | quote }}
{{- if .Values.conductor.oidc.enabled }}
            # OIDC bearer-token security (service mode). See values.yaml conductor.oidc.
            - name: QUARKUS_OIDC_TENANT_ENABLED
              value: "true"
            - name: OIDC_ISSUER
              value: {{ required "conductor.oidc.authServerUrl is required when conductor.oidc.enabled=true" .Values.conductor.oidc.authServerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.conductor.oidc.clientId | quote }}
            - name: CONDUCTOR_API_POLICY
              value: {{ .Values.conductor.oidc.apiPolicy | quote }}
{{- if .Values.conductor.oidc.audience }}
            - name: QUARKUS_OIDC_TOKEN_AUDIENCE
              value: {{ .Values.conductor.oidc.audience | quote }}
{{- end }}
{{- end }}
            - name: ALERTING_EVALUATION_INTERVAL
              value: {{ .Values.alerting.evaluation.interval | quote }}
            - name: ALERTING_HISTORY_RETENTION
              value: {{ .Values.alerting.history.retention | quote }}
            - name: ALERTING_HISTORY_CLEANUP_INTERVAL
              value: {{ .Values.alerting.history.cleanup.interval | quote }}
            - name: ALERTING_WEBHOOK_ALLOW_PRIVATE_NETWORKS
              value: {{ .Values.alerting.webhook.allowPrivateNetworks | quote }}
            - name: ALERTING_WEBHOOK_MAX_ATTEMPTS
              value: {{ .Values.alerting.webhook.maxAttempts | quote }}
            - name: ALERTING_WEBHOOK_CONNECT_TIMEOUT
              value: {{ .Values.alerting.webhook.connectTimeout | quote }}
            - name: ALERTING_WEBHOOK_READ_TIMEOUT
              value: {{ .Values.alerting.webhook.readTimeout | quote }}
            - name: QUARKUS_MAILER_HOST
              value: {{ .Values.alerting.email.host | quote }}
            - name: QUARKUS_MAILER_PORT
              value: {{ .Values.alerting.email.port | quote }}
            - name: QUARKUS_MAILER_FROM
              value: {{ .Values.alerting.email.from | quote }}
            - name: QUARKUS_MAILER_START_TLS
              value: {{ .Values.alerting.email.startTls | quote }}
{{- if .Values.alerting.email.auth.existingSecret }}
            - name: QUARKUS_MAILER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alerting.email.auth.existingSecret }}
                  key: username
            - name: QUARKUS_MAILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alerting.email.auth.existingSecret }}
                  key: password
{{- end }}
{{ include "debezium-platform.offsetConfig" . | indent 12 }}
{{ include "debezium-platform.schemaHistoryConfig" . | indent 12 }}
{{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value }}
{{- end }}
{{- range $key, $value := .Values.pipeline.labels }}
            - name: {{ include "debezium-platform.toEnv" (dict "prefix" "PIPELINE_LABELS" "key" $key) | trim }}
              value: {{ $value | quote }}
{{- end }}
{{- with .Values.conductor.extraVolumes }}
      volumes:
{{ toYaml . | indent 8 }}
{{- end }}
      restartPolicy: Always
