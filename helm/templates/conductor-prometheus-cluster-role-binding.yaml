{{- if and .Values.monitoring.otel.enabled .Values.monitoring.prometheus.rbac.clusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # Cluster-scoped, so the namespace keeps two installations from colliding.
  name: conductor-prometheus-{{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.monitoring.prometheus.rbac.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: conductor-service-account
    namespace: {{ .Release.Namespace }}
{{- end }}
