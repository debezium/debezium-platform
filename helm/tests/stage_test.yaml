suite: test stage resources
templates:
  - stage-deployment.yaml
  - stage-service.yaml
values:
  - ../../examples/example.yaml
tests:
  - it: should create stage deployment with correct configuration
    template: stage-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: stage
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stage
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: debezium-platform
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: stage
      - equal:
          path: spec.template.spec.containers[0].name
          value: stage
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: TCP
      - isNotEmpty:
          path: spec.template.spec.containers[0].image
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - isNotEmpty:
          path: spec.template.spec.containers[0].env
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: CONDUCTOR_URL
      - isNotEmpty:
          path: spec.template.spec.containers[0].env[0].value
      - equal:
          path: spec.template.spec.restartPolicy
          value: Always

  - it: should build an http conductor URL when ingress TLS is disabled
    template: stage-deployment.yaml
    set:
      domain.name: dmp.example.com
      ingress.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONDUCTOR_URL
            value: http://dmp.example.com

  - it: should build an https conductor URL from ingress TLS
    template: stage-deployment.yaml
    set:
      domain.name: dmp.example.com
      ingress.enabled: true
      ingress.tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONDUCTOR_URL
            value: https://dmp.example.com

  - it: should let domain.scheme override the scheme when ingress is disabled
    template: stage-deployment.yaml
    set:
      domain.name: dmp.example.com
      domain.scheme: https
      ingress.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONDUCTOR_URL
            value: https://dmp.example.com

  - it: should let domain.scheme take precedence over ingress TLS
    template: stage-deployment.yaml
    set:
      domain.name: dmp.example.com
      domain.scheme: http
      ingress.enabled: true
      ingress.tls.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONDUCTOR_URL
            value: http://dmp.example.com

  - it: should create stage service with correct ports
    template: stage-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: stage
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: stage
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: stage
      - equal:
          path: spec.ports[0].name
          value: stage-port
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[0].targetPort
          value: 3000

  - it: should not render imagePullSecrets by default
    template: stage-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - isNull:
          path: spec.template.spec.imagePullSecrets

  - it: should apply the global imagePullSecrets
    template: stage-deployment.yaml
    set:
      imagePullSecrets:
        - name: global-registry-secret
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry-secret

  - it: should replace the global imagePullSecrets with the stage ones
    template: stage-deployment.yaml
    set:
      imagePullSecrets:
        - name: global-registry-secret
      stage.imagePullSecrets:
        - name: stage-registry-secret
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: stage-registry-secret
      - notContains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: global-registry-secret

  - it: should leave stage inheriting the global imagePullSecrets when only conductor overrides
    template: stage-deployment.yaml
    set:
      imagePullSecrets:
        - name: global-registry-secret
      conductor.imagePullSecrets:
        - name: conductor-registry-secret
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-registry-secret
