suite: test monitoring resources
templates:
  - otel-collector.yaml
  - servicemonitor.yaml
  - conductor-deployment.yaml
  - conductor-prometheus-cluster-role-binding.yaml
values:
  - ../../examples/example.yaml
tests:
  # OpenTelemetryCollector CR tests
  - it: should create OpenTelemetryCollector when monitoring.otel.enabled is true
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - isKind:
          of: OpenTelemetryCollector
      - equal:
          path: metadata.name
          value: debezium-platform-otel-collector
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: otel-collector
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: monitoring
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: debezium-platform
      - equal:
          path: spec.mode
          value: deployment
      - equal:
          path: spec.replicas
          value: 1
      - isNotEmpty:
          path: spec.config

  - it: should not create OpenTelemetryCollector when monitoring.otel.enabled is false
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure custom replicas
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.otel.collector.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should configure custom receiver ports
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.otel.collector.receivers.grpc.port: 14317
      monitoring.otel.collector.receivers.http.port: 14318
    asserts:
      - equal:
          path: spec.config.receivers.otlp.protocols.grpc.endpoint
          value: "0.0.0.0:14317"
      - equal:
          path: spec.config.receivers.otlp.protocols.http.endpoint
          value: "0.0.0.0:14318"

  - it: should configure custom batch processor settings
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.otel.collector.processors.batch.timeout: 10s
      monitoring.otel.collector.processors.batch.sendBatchSize: 1024
    asserts:
      - equal:
          path: spec.config.processors.batch.timeout
          value: 10s
      - equal:
          path: spec.config.processors.batch.send_batch_size
          value: 1024

  - it: should configure custom prometheus exporter settings
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.otel.collector.exporters.prometheus.port: 9090
    asserts:
      - equal:
          path: spec.config.exporters.prometheus.endpoint
          value: "0.0.0.0:9090"

  - it: should configure metrics pipeline
    template: otel-collector.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - equal:
          path: spec.config.service.pipelines.metrics.receivers
          value:
            - otlp
      - equal:
          path: spec.config.service.pipelines.metrics.processors
          value:
            - batch
      - equal:
          path: spec.config.service.pipelines.metrics.exporters
          value:
            - prometheus

  # ServiceMonitor tests
  - it: should create ServiceMonitor when monitoring is fully enabled
    template: servicemonitor.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.prometheus.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: debezium-platform-otel-collector
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: otel-collector
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: monitoring
      - equal:
          path: spec.endpoints[0].port
          value: prometheus
      - equal:
          path: spec.endpoints[0].interval
          value: 15s

  - it: should not create ServiceMonitor when monitoring.otel.enabled is false
    template: servicemonitor.yaml
    set:
      monitoring.otel.enabled: false
      monitoring.prometheus.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create ServiceMonitor when serviceMonitor.enabled is false
    template: servicemonitor.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.prometheus.serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should apply custom serviceMonitor labels
    template: servicemonitor.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.prometheus.serviceMonitor.enabled: true
      monitoring.prometheus.serviceMonitor.labels:
        release: my-prometheus
    asserts:
      - equal:
          path: metadata.labels.release
          value: my-prometheus

  - it: should configure custom scrape interval
    template: servicemonitor.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
      monitoring.prometheus.serviceMonitor.enabled: true
      monitoring.prometheus.serviceMonitor.scrapeInterval: 30s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  # Conductor deployment monitoring env vars tests
  - it: should inject monitoring env vars when monitoring.otel.enabled is true
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_ENDPOINT
            value: "http://debezium-platform-otel-collector-collector.NAMESPACE.svc.cluster.local:4318"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_URL
            value: "http://prometheus:9090"

  - it: should inject OTel interval env vars with default values when monitoring.otel.enabled is true
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_JMX_INTERVAL_MS
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_METRIC_EXPORT_INTERVAL_MS
            value: "5000"

  - it: should inject custom OTel interval env vars when overridden
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.otel.jmxIntervalMs: 2000
      monitoring.otel.metricExportIntervalMs: 10000
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_JMX_INTERVAL_MS
            value: "2000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_METRIC_EXPORT_INTERVAL_MS
            value: "10000"

  - it: should not inject monitoring env vars when monitoring.otel.enabled is false
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_ENABLED
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_ENDPOINT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_JMX_INTERVAL_MS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PIPELINE_MONITORING_OTEL_METRIC_EXPORT_INTERVAL_MS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_URL
          any: true

  - it: should set MONITORING_PANELS_PATH when additionalPanelsPath is configured
    template: conductor-deployment.yaml
    set:
      monitoring.panels.additionalPanelsPath: /opt/config/panels.yml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PANELS_PATH
            value: /opt/config/panels.yml

  - it: should not set MONITORING_PANELS_PATH when additionalPanelsPath is empty
    template: conductor-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PANELS_PATH
          any: true

  - it: should fail when monitoring.otel.enabled is true but monitoring.prometheus.url is not set
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "monitoring.prometheus.url is required when monitoring.otel.enabled is true"

  # Prometheus client authentication and TLS
  - it: should not set any Prometheus credential or TLS env var by default
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "http://prometheus:9090"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BEARER_TOKEN_FILE
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BEARER_TOKEN
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BASIC_AUTH_USERNAME
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_TRUST_STORE_PEM_CERTS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_TRUST_ALL
          any: true
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should point the conductor at its service account token when auth.bearerToken.serviceAccount is true
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://thanos-querier.openshift-monitoring.svc:9091"
      monitoring.prometheus.auth.bearerToken.serviceAccount: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BEARER_TOKEN_FILE
            value: /var/run/secrets/kubernetes.io/serviceaccount/token

  - it: should read a static bearer token from a Secret
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.auth.bearerToken.existingSecret: prometheus-token
      monitoring.prometheus.auth.bearerToken.secretKey: api-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BEARER_TOKEN
            valueFrom:
              secretKeyRef:
                name: prometheus-token
                key: api-token

  - it: should read basic auth credentials from a Secret
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.auth.basic.existingSecret: prometheus-basic
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BASIC_AUTH_USERNAME
            valueFrom:
              secretKeyRef:
                name: prometheus-basic
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BASIC_AUTH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: prometheus-basic
                key: password

  - it: should fail when more than one Prometheus authentication method is set
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.auth.bearerToken.serviceAccount: true
      monitoring.prometheus.auth.basic.existingSecret: prometheus-basic
    asserts:
      - failedTemplate:
          errorMessage: "only one of monitoring.prometheus.auth.bearerToken.serviceAccount, auth.bearerToken.existingSecret and auth.basic.existingSecret can be set"

  - it: should trust a CA file already present in the container
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://thanos-querier.openshift-monitoring.svc:9091"
      monitoring.prometheus.tls.caFile: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_TRUST_STORE_PEM_CERTS
            value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      - notExists:
          path: spec.template.spec.volumes

  - it: should mount the CA from a ConfigMap
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://thanos-querier.openshift-monitoring.svc:9091"
      monitoring.prometheus.tls.caConfigMap: openshift-service-ca.crt
      monitoring.prometheus.tls.caKey: service-ca.crt
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_TRUST_STORE_PEM_CERTS
            value: /etc/debezium/prometheus-ca/ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: prometheus-ca
            configMap:
              name: openshift-service-ca.crt
              items:
                - key: service-ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: prometheus-ca
            mountPath: /etc/debezium/prometheus-ca
            readOnly: true

  - it: should mount the CA from a Secret alongside extra volumes
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.tls.caSecret: prometheus-ca
      conductor.extraVolumes:
        - name: truststore
          configMap:
            name: conductor-truststore
      conductor.extraVolumeMounts:
        - name: truststore
          mountPath: /etc/truststore
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: prometheus-ca
            secret:
              secretName: prometheus-ca
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: truststore
            configMap:
              name: conductor-truststore
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 2

  - it: should fail when more than one Prometheus CA source is set
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.tls.caFile: /etc/ssl/ca.crt
      monitoring.prometheus.tls.caSecret: prometheus-ca
    asserts:
      - failedTemplate:
          errorMessage: "only one of monitoring.prometheus.tls.caFile, caConfigMap and caSecret can be set"

  - it: should disable certificate verification when tls.insecureSkipVerify is true
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://prometheus.example.com"
      monitoring.prometheus.tls.insecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_TRUST_ALL
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_TLS_PROMETHEUS_HOSTNAME_VERIFICATION_ALGORITHM
            value: "NONE"

  - it: should not mount the Prometheus CA when monitoring.otel.enabled is false
    template: conductor-deployment.yaml
    set:
      monitoring.otel.enabled: false
      monitoring.prometheus.auth.bearerToken.serviceAccount: true
      monitoring.prometheus.tls.caConfigMap: openshift-service-ca.crt
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONITORING_PROMETHEUS_BEARER_TOKEN_FILE
          any: true
      - notExists:
          path: spec.template.spec.volumes

  - it: should bind the conductor service account to the configured ClusterRole
    template: conductor-prometheus-cluster-role-binding.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://thanos-querier.openshift-monitoring.svc:9091"
      monitoring.prometheus.rbac.clusterRole: cluster-monitoring-view
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: conductor-prometheus-NAMESPACE
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-monitoring-view
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: conductor-service-account
              namespace: NAMESPACE

  - it: should not create a ClusterRoleBinding by default
    template: conductor-prometheus-cluster-role-binding.yaml
    set:
      monitoring.otel.enabled: true
      monitoring.prometheus.url: "https://thanos-querier.openshift-monitoring.svc:9091"
      monitoring.prometheus.auth.bearerToken.serviceAccount: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a ClusterRoleBinding when monitoring.otel.enabled is false
    template: conductor-prometheus-cluster-role-binding.yaml
    set:
      monitoring.otel.enabled: false
      monitoring.prometheus.rbac.clusterRole: cluster-monitoring-view
    asserts:
      - hasDocuments:
          count: 0
