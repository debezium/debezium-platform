domain:
  url: ""
  name: ""
  # Optional. Overrides the scheme otherwise derived from ingress TLS. Set this
  # when TLS terminates outside the chart's ingress (e.g. an external reverse
  # proxy) and ingress.enabled is false, otherwise the stage UI builds an http://
  # conductor URL and the browser blocks /api calls as mixed content.
  # scheme: https
# Global list of image pull secrets, applied to the pods this chart renders itself:
# conductor, stage, and the Debezium Server pods created by pipelines.
# A per-component imagePullSecrets replaces this list, it is not merged with it.
# The operator pod is rendered by the debezium-operator subchart and is not
# covered, see "Image pull secrets" in the README.
# Example:
#   imagePullSecrets:
#     - name: my-registry-secret
imagePullSecrets: []
stage:
  image: quay.io/debezium/platform-stage:nightly
  imagePullPolicy: IfNotPresent
  # Replaces the global imagePullSecrets for the stage pod. Leave empty to inherit it.
  imagePullSecrets: []
conductor:
  image: quay.io/debezium/platform-conductor:nightly
  imagePullPolicy: IfNotPresent
  # Replaces the global imagePullSecrets for the conductor pod. Leave empty to inherit it.
  imagePullSecrets: []
  offset:
    existingConfigMap: ""
  descriptors:
    official:
      enabled: true
      registry: quay.io
      image: debezium/debezium-descriptors
      tag: nightly
      mountPath: /opt/descriptors
      # Name of a Secret holding keys `username` and `password` for the descriptors registry.
      auth:
        existingSecret: ""
  extraVolumes: [ ]
  extraVolumeMounts: [ ]
  # OIDC bearer-token security (resource-server in service mode). Disabled by
  # default. When enabled, tokens are validated against the issuer's JWKS.
  oidc:
    # Deprecated: use conductor.security.enabled instead. Left unset (null) by
    # default so the chart can tell "not configured" apart from "set to false";
    # setting both this and conductor.security.enabled to disagreeing values
    # fails `helm template`. This alias is removed after one minor release.
    enabled: null
    # OIDC issuer / realm URL, e.g. https://keycloak.example.com/realms/dmp.
    # Required when conductor.security.enabled=true.
    authServerUrl: ""
    # Keycloak client id whose roles are read from resource_access.<clientId>.
    # Must match a client in the realm. Realm roles resolve regardless of this
    # value.
    clientId: conductor
    # Expected audience (aud) claim. Required when conductor.security.enabled=true:
    # without it, a token minted for an unrelated client in the same realm is
    # accepted (the conductor refuses to start if this is left empty).
    audience: ""
    # Claim path for roles, for identity providers that do not use Keycloak's
    # realm_access.roles / resource_access.<clientId>.roles shape (e.g. Entra ID
    # app roles). Example: "resource_access/conductor/roles".
    roleClaimPath: ""
  # Authorization: the single IAM switch and everything it governs (authentication,
  # authorization, and the internal callback credential). See the IAM design docs.
  security:
    # The single IAM switch. Governs quarkus.oidc.tenant-enabled (derived, never
    # configure it directly) and all @PermissionsAllowed enforcement. Left unset
    # (null) by default; see conductor.oidc.enabled above for why.
    enabled: null
    # Always granted every permission, evaluated ahead of the role-mapping lookup.
    # The recovery path for a deployment whose mapping is wrong or whose directory
    # emits a role nobody has mapped yet.
    bootstrapAdminRole: ""
    # Role name to permission bundle, e.g.:
    #   roleMappings:
    #     - role: platform-engineering
    #       permissions: ["*"]
    #     - role: sre-oncall
    #       permissions: [pipeline:read, pipeline:operate, pipeline:logs]
    # Left empty, the shipped default bundles apply (dmp-admin/dmp-editor/
    # dmp-operator/dmp-viewer). Rendered into a mounted ConfigMap, never into env
    # vars: role names must match identity-provider claim values byte-for-byte,
    # and env-var key transformation would mangle them silently.
    roleMappings: []
    internalCredential:
      # Name of a Secret holding key `secret` (and, during rotation only, key
      # `previous-secret`). Required for Debezium Server's snapshot-notification
      # callbacks to authenticate once conductor.security.enabled=true; see the
      # IAM design's staged-enablement guidance before enabling both at once.
      existingSecret: ""
server:
  image: ""
  # Replaces the global imagePullSecrets for Debezium Server pods created by pipelines. Leave empty to inherit it.
  imagePullSecrets: []
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
offset:
  reusePlatformDatabase: true
  database:
    name: postgres
    host: postgres
    port: 5432
    username: user
    password: password
    auth:
      existingSecret: ""
schemaHistory:
  reusePlatformDatabase: true
  database:
    name: postgres
    host: postgres
    port: 5432
    username: user
    password: password
    auth:
      existingSecret: ""
database:
  enabled: false
  name: postgres
  host: postgres
  auth:
    existingSecret: ""
debezium-operator:
  enabled: true
pipeline:
  labels: {}
  health:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
monitoring:
  otel:
    enabled: false
    jmxIntervalMs: 1000
    metricExportIntervalMs: 5000
    collector:
      # The Prometheus exporter is included in the base (otelcol) and contrib distributions,
      # but NOT in the k8s distribution (otelcol-k8s) which is the default when the OTel Operator
      # is installed via Helm. Override the image if your operator defaults to k8s distribution.
      # Example: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.152.0
      image: ""
      replicas: 1
      receivers:
        grpc:
          port: 4317
        http:
          port: 4318
      processors:
        batch:
          timeout: 5s
          sendBatchSize: 512
      exporters:
        prometheus:
          port: 8889
          resourceToTelemetryConversion: true
          constLabels:
            platform: debezium
  panels:
    additionalPanelsPath: ""
    refreshInterval: 30s
  prometheus:
    url: ""
    serviceMonitor:
      enabled: true
      scrapeInterval: 15s
      labels:
        prometheus: kube-prometheus
alerting:
  evaluation:
    interval: "60s"
  history:
    retention: "30d"
    cleanup:
      interval: "24h"
  webhook:
    allowPrivateNetworks: false
    maxAttempts: 3
    connectTimeout: "5S"
    readTimeout: "10S"
  email:
    host: ""
    port: 587
    from: ""
    startTls: "REQUIRED"
    auth:
      existingSecret: ""
env: []
