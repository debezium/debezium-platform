# ---------------------------------------------------------------------------
# Deployment mode selection
# Property is read at runtime — no rebuild needed to switch modes.
# Supported values:
#   operator  — Kubernetes path via Debezium Operator (default when unset)
#   host      — Bare-metal/VM path via SSH config + Host Agent
#
# To activate host mode, set this property at startup:
#   ./mvnw quarkus:dev -Ddebezium.deployment.mode=host
#   docker run -e DEBEZIUM_DEPLOYMENT_MODE=host platform-conductor:latest
# ---------------------------------------------------------------------------
# debezium.deployment.mode=operator

# ---------------------------------------------------------------------------
# Host mode — SSH config file watcher
# Path to the SSH config file used for host discovery.
# Default: ~/.ssh/config (resolved at runtime, ~ is expanded)
# ---------------------------------------------------------------------------
# platform.host.ssh-config-path=~/.ssh/config

# ---------------------------------------------------------------------------
# Host mode — Ansible playbook paths
# Optional overrides. When unset, the bundled playbooks from
# src/main/resources/ansible/ are used automatically.
# ---------------------------------------------------------------------------
# platform.host.ansible-playbook-path=/custom/path/to/host-setup.yml
# platform.host.ansible-teardown-path=/custom/path/to/host-teardown.yml

# ---------------------------------------------------------------------------
# Host mode — Ansible execution settings
# platform.host.ansible-timeout-minutes: max wait time for playbook completion
# platform.host.executor-pool-size: thread pool size for concurrent provisioning
# platform.host.shutdown-timeout-seconds: grace period for executor shutdown
# ---------------------------------------------------------------------------
# platform.host.ansible-timeout-minutes=30
# platform.host.executor-pool-size=4
# platform.host.shutdown-timeout-seconds=5
