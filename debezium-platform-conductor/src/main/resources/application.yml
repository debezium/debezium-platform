monitoring:
  panels:
    path: ${MONITORING_PANELS_PATH:}
    refresh-interval: 30s
alerting:
  evaluation:
    interval: ${ALERTING_EVALUATION_INTERVAL:60s}
  history:
    retention: ${ALERTING_HISTORY_RETENTION:30d}
    cleanup:
      interval: ${ALERTING_HISTORY_CLEANUP_INTERVAL:24h}
conductor:
  watcher:
    enabled: true
    heartbeat:
      interval-ms: 300000
    retry:
      max-retries: 3
    offset:
      storage:
        type: org.apache.kafka.connect.storage.FileOffsetBackingStore
        config:
          file:
            filename: offsets.dat
      config:
        flush:
          interval:
            ms: 300
  descriptors:
    # Volume source mode (controlled by environment or profile)
    # - true: Read from mounted volumes (K8s 1.35+ image volumes)
    # - false: Download via ORAS (K8s <1.35 or dev/test)
    volume-source: true
    path: /opt/descriptors

    # ORAS download configuration (used when volume-source=false)
    # In production (K8s <1.35), these are overridden by Helm via environment variables
    image:
      registry: quay.io
      name: debezium/debezium-descriptors
      tag: nightly
  # The single IAM switch (debezium/dbz#3003). quarkus.oidc.tenant-enabled below is
  # derived from this, so authentication and authorization cannot be configured to
  # disagree. role-mappings is supplied from a mounted ConfigMap in Helm deployments
  # via quarkus.config.locations; left empty, the shipped default bundles apply
  # (dmp-admin/dmp-editor/dmp-operator/dmp-viewer).
  security:
    enabled: ${CONDUCTOR_SECURITY_ENABLED:false}
    bootstrap-admin-role: ${CONDUCTOR_SECURITY_BOOTSTRAP_ADMIN_ROLE:}
    internal-credential:
      secret: ${CONDUCTOR_INTERNAL_CREDENTIAL_SECRET:}
      previous-secret: ${CONDUCTOR_INTERNAL_CREDENTIAL_PREVIOUS_SECRET:}
pipeline:
  offset:
    storage:
      # In the future when we will have other environment implementations the default should be re-thought.
      type: io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
      config:
        jdbc:
          connection:
            url: ${OFFSET_JDBC_URL:${quarkus.datasource.jdbc.url}}
            user: ${OFFSET_JDBC_USERNAME:${quarkus.datasource.username}}
            password: ${OFFSET_JDBC_PASSWORD:${quarkus.datasource.password}}
          offset:
            table:
              name: "@{pipeline_name}_offset"
  schema:
    history:
      internal: io.debezium.storage.jdbc.history.JdbcSchemaHistory
      config:
        jdbc:
          connection:
            url: ${SCHEMA_HISTORY_JDBC_URL:${quarkus.datasource.jdbc.url}}
            user: ${SCHEMA_HISTORY_JDBC_USERNAME:${quarkus.datasource.username}}
            password: ${SCHEMA_HISTORY_JDBC_PASSWORD:${quarkus.datasource.password}}
          schema:
            history:
              table:
                name: "@{pipeline_name}_schema_history"
  labels: {}
  server:
    image: ${PIPELINE_SERVER_IMAGE:}
    image-pull-secrets: ${PIPELINE_SERVER_IMAGE_PULL_SECRETS:}
  monitoring:
    otel:
      enabled: ${PIPELINE_MONITORING_OTEL_ENABLED:false}
      endpoint: ${PIPELINE_MONITORING_OTEL_ENDPOINT:http://localhost:4318}
      jmx-interval-ms: ${PIPELINE_MONITORING_OTEL_JMX_INTERVAL_MS:1000}
      metric-export-interval-ms: ${PIPELINE_MONITORING_OTEL_METRIC_EXPORT_INTERVAL_MS:5000}
sources:
  database:
    connection:
      timeout: 60
destinations:
  redis:
    connection:
      timeout: 60
  kafka:
    connection:
      timeout: 60
  infinispan:
    connection:
      timeout: 60
  pravega:
    connection:
      timeout: 60
  pulsar:
    connection:
      timeout: 60
  eventhubs:
    connection:
      timeout: 60

  rabbitmq:
    connection:
      timeout: 60
  pubsub:
    connection:
      timeout: 60
      scope: https://www.googleapis.com/auth/pubsub
  qdrant:
    connection:
      timeout: 60
  milvus:
    connection:
      timeout: 60
  rocketmq:
    connection:
      timeout: 60
      
quarkus:
  smallrye-openapi:
    store-schema-directory: ../openapi
    info-title: Debezium Platform API
    info-version: ${quarkus.application.version}
    info-description: REST API for the Debezium Platform
    info-contact-name: Debezium
    info-contact-url: https://github.com/debezium/debezium-platform
  hibernate-orm:
    mapping:
      format:
        global: ignore
  rest-client:
    debezium-server-api:
      url: http://localhost:8080
      # Avoid throwing an exception when HTTP status code is higher than 400
      disable-default-mapper: true
    prometheus-api:
      url: ${MONITORING_PROMETHEUS_URL:http://localhost:9090}
      read-timeout: 30000
    host-agent-api:
      url: http://localhost:8090
      connect-timeout: 5000
      read-timeout: 30000
      # HostAgentClient maps Agent responses, including 404, explicitly.
      disable-default-mapper: true
  # OIDC bearer-token validation (service mode), OFF by default. tenant-enabled is
  # DERIVED from conductor.security.enabled (debezium/dbz#3003): never configure it
  # independently, or the two enforcement layers (authentication here, authorization
  # below and in code) could be made to disagree, which is the partial-enforcement
  # state the design forbids.
  oidc:
    tenant-enabled: ${conductor.security.enabled}
    application-type: service
    auth-server-url: ${OIDC_ISSUER:https://keycloak.invalid/realms/none}
    client-id: ${OIDC_CLIENT_ID:conductor}
    token:
      # REQUIRED when IAM is enabled; EnforcementValidator fails the boot if unset.
      # Quarkus skips audience validation entirely when this is empty, so leaving it
      # optional would have meant off by default: the control exists, appears
      # configured, and does nothing.
      audience: ${OIDC_AUDIENCE:}
    roles:
      # Non-Keycloak IdPs (e.g. Entra ID app roles) may need this; Keycloak's
      # realm_access.roles / resource_access.<client-id>.roles resolve without it.
      role-claim-path: ${OIDC_ROLE_CLAIM_PATH:}
  security:
    jaxrs:
      # Build-time and unconditional, but IamAuthorizationController skips every
      # annotation check when IAM is disabled, so this has no effect on an IAM-off
      # deployment (debezium/dbz#3003). Makes "no permission declared" a 403 rather
      # than an accidental grant: EndpointPermissionCoverageTest additionally fails
      # the build if any endpoint relies on this rather than declaring a permission.
      deny-unannotated-endpoints: true
  keycloak:
    devservices:
      enabled: false
  http:
    cors:
        ~: true
        origins: ${CONDUCTOR_CORS_ORIGINS:}
    auth:
      permission:
        # More specific than /api/* so it wins (debezium/dbz#3003). Debezium Server has no OIDC
        # token; the guard is InternalCredentialFilter, not this policy, which merely keeps the
        # generic "authenticated" floor from applying to a path that could never satisfy it.
        internal:
          enabled: ${conductor.security.enabled}
          paths: /api/internal/*
          policy: permit
        api:
          enabled: ${conductor.security.enabled}
          paths: /api/*
          policy: authenticated
        # More specific than /q/* so it wins (debezium/dbz#3003). These callers
        # cannot present a token: the kubelet probes, and the scraper is a
        # sidecar/collector. /q/health is listed separately from /q/health/*
        # because the aggregate endpoint is not a sub-path.
        probes:
          enabled: ${conductor.security.enabled}
          paths: /q/health,/q/health/*,/q/metrics
          policy: permit
        # Everything else under /q, in practice /q/openapi. Was "permit";
        # the spec is not secret, but it should not be anonymously readable
        # either (debezium/dbz#3003).
        infra:
          enabled: ${conductor.security.enabled}
          paths: /q/*
          policy: authenticated
  debezium-outbox:
    table-name: events
    aggregate-type:
      name: aggregatetype
    aggregate-id:
      name: aggregateid
    type:
      name: type
  datasource:
    db-kind: postgresql
  flyway:
    baseline-on-migrate: true
    migrate-at-start: true
  swagger-ui:
    # Restores the Quarkus default: dev/test only. Debezium/dbz#3003 removes the
    # earlier opt-in to production exposure.
    always-include: false
  log:
    min-level: TRACE
    level: INFO

  # ORAS registry configuration (profile-independent)
  # Registry bean is created when host is configured
  # Whether it's actually used is controlled by conductor.descriptors.volume-source
  # Setting a default value ensures the bean is created at build time
  oras:
    registries:
      "registry":
        host: ${conductor.descriptors.image.registry}
        enabled: true
        username: ${CONDUCTOR_DESCRIPTORS_REGISTRY_USERNAME:}
        password: ${CONDUCTOR_DESCRIPTORS_REGISTRY_PASSWORD:}

"%dev":
  conductor:
    descriptors:
      # Override to use ORAS download mode in dev
      volume-source: false
      path: descriptors
    watcher:
      enabled: true
      crd: https://raw.githubusercontent.com/debezium/debezium-operator/main/k8/debeziumservers.debezium.io-v1.yml
      offset:
        storage:
          type: org.apache.kafka.connect.storage.FileOffsetBackingStore
          config:
            file:
              filename: offsets.dat
        config:
          flush:
            interval:
              ms: 300
  pipeline:
    offset:
      storage:
        # In the future when we will have other environment implementations the default should be re-thought.
        type: io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
        config:
          jdbc:
            url: jdbc:postgresql://postgresql:5432/debezium?loggerLevel=OFF
            user: debezium
            password: debezium
            offset:
              table:
                name: "@{pipeline_name}_offset"
    schema:
      history:
        internal: io.debezium.storage.jdbc.history.JdbcSchemaHistory
        config:
          jdbc:
            url: jdbc:postgresql://postgresql:5432/debezium?loggerLevel=OFF
            user: debezium
            password: debezium
            schema:
              history:
                table:
                  name: "@{pipeline_name}_schema_history"
  quarkus:
    debezium-outbox:
      remove-after-insert: false
    flyway:
      baseline-on-migrate: true
      migrate-at-start: true
    datasource:
      devservices:
        enabled: true
        port: 5432
        image-name: quay.io/debezium/postgres:16-alpine
    http:
      port: 8081
    log:
      level: INFO
      category:
        "io.debezium":
          level: INFO
        "io.debezium.platform.environment.actions":
          level: TRACE

"%test":
  sources:
    database:
      connection:
        timeout: 2
  destinations:
    redis:
      connection:
        timeout: 2
    kafka:
      connection:
        timeout: 2
    infinispan:
      connection:
        timeout: 2
    pravega:
      connection:
        timeout: 2
    pulsar:
      connection:
        timeout: 2
    eventhubs:
      connection:
        timeout: 2
    rabbitmq:
      connection:
        timeout: 2
    pubsub:
      connection:
        timeout: 2
    qdrant:
      connection:
        timeout: 2
    milvus:
      connection:
        timeout: 2
    rocketmq:
      connection:
        timeout: 2
  conductor:
    descriptors:
      # Override to use ORAS download mode in test
      volume-source: false
      path: descriptors
    watcher:
      enabled: true
      offset:
        storage:
          type: org.apache.kafka.connect.storage.MemoryOffsetBackingStore
  quarkus:
    otel:
      metrics:
        enabled: true
      metric:
        export:
          interval: 100ms
    http:
      test-port: 0
    debezium-outbox:
      remove-after-insert: false
    datasource:
      devservices:
        enabled: true
        image-name: quay.io/debezium/postgres:16-alpine
    flyway:
      baseline-on-migrate: true
