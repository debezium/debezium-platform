quarkus.rest-client.logging.scope=request-response
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
# Custom test properties
# Overriding the default port (5000) to avoid conflicts with macOS AirPlay Receiver during local tests
quarkus.oras.devservices.base-port=25000

# A QuarkusTestProfile that overrides getConfigProfile() replaces the "test" profile rather than adding
# to it, so those tests never see the %test block in application.yml and fall back to quarkus.http.port
# (8081). Setting the test port here, outside any profile, keeps every profile on a random port.
quarkus.http.test-port=0

