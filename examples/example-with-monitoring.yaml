domain:
  name: platform.debezium.io
database:
  enabled: true
ingress:
  className: nginx

monitoring:
  otel:
    enabled: true
    collector:
      image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.152.0"
      replicas: 1
  prometheus:
    url: "http://kube-prometheus-stack-prometheus:9090"
    serviceMonitor:
      enabled: true
      scrapeInterval: 15s
      labels:
        prometheus: kube-prometheus
