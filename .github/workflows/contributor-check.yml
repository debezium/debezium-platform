name: Contributor Check
on:
  # Runs with the read-only token of the pull request. Comments are posted by pr-check-comments.yml,
  # which is triggered through workflow_run from the result recorded by this workflow.
  pull_request:
    branches:
      - main
      - 1.*
      - 2.*
      - 3.*
      - 4.*
    types: [ opened ]
permissions:
  contents: read

jobs:
  check-contributors:
    uses: debezium/dbz/.github/workflows/contributor-check.yml@main