name: Test Debezium platform (conductor)
on:
  push:
    paths:
      - "debezium-platform-conductor/**"
      - ".github/**"
    branches:
      - main
  pull_request:
    paths:
      - "debezium-platform-conductor/**"
      - ".github/**"
    branches:
      - main
jobs:
  # Checks that all commits contain sign-offs
  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: debezium/dbz/.github/actions/check-dco@main

  build_cache:
    name: "Update Dependencies"
    needs: [ check-signed-commits ]
    if: ${{ !cancelled() && (needs.check-signed-commits.result == 'success' || needs.check-signed-commits.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.build-cache.outputs.cache_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and cache dependencies
        id: build-cache
        uses: ./.github/actions/build-cache
        with:
          working-directory: debezium-platform-conductor
          github-event-name: ${{ github.event_name }}
  check_style:
    name: "Checkstyle and Formatting"
    needs: [ build_cache ]
    if: ${{ !cancelled() && needs.build_cache.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debezium-platform-conductor
    steps:
      - name: Checkout Action
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven Repository
        id: cache-check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{needs.build_cache.outputs.cache_key}}

      - name: "Checkstyle, Formatting, and Import Order Checks"
        run: >
          ./mvnw -B -ntp process-sources checkstyle:checkstyle
          -Dformat.formatter.goal=validate
          -Dformat.imports.goal=check
          -Dorg.slf4j.simpleLogger.showDateTime=true
          -Dorg.slf4j.simpleLogger.dateTimeFormat="YYYY-MM-dd HH:mm:ss,SSS"
  validate_ansible:
    name: "Validate Ansible playbooks"
    needs: [ check-signed-commits ]
    if: ${{ !cancelled() && (needs.check-signed-commits.result == 'success' || needs.check-signed-commits.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      # one path per line; adjust to where the playbooks live
      ANSIBLE_PLAYBOOKS: |
        debezium-platform-conductor/src/main/resources/ansible/host-setup.yml
        debezium-platform-conductor/src/main/resources/ansible/host-teardown.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Ansible tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install ansible-core ansible-lint
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install required collections
        run: >
          ansible-galaxy collection install
          community.docker community.general ansible.posix

      - name: Lint and syntax check playbooks
        run: |
          rc=0
          while IFS= read -r pb; do
            [ -z "$pb" ] && continue
            echo "::group::$pb"
            ansible-lint "$pb" || rc=1
            ansible-playbook --syntax-check -i localhost, "$pb" || rc=1
            echo "::endgroup::"
          done <<< "$ANSIBLE_PLAYBOOKS"
          exit $rc
  tests:
    name: "Run tests"
    needs: [ build_cache, check_style, validate_ansible ]
    if: ${{ !cancelled() && needs.build_cache.result == 'success' && needs.check_style.result == 'success' && needs.validate_ansible.result == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/tests
        with:
          working-directory: debezium-platform-conductor
          cache-key: ${{ needs.build_cache.outputs.cache_key }}