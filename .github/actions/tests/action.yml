name: "Run Tests"
description: "Run Maven tests for Debezium platform"

inputs:
  working-directory:
    description: 'Working directory for the tests'
    required: true
  cache-key:
    description: 'Cache key for Maven repository'
    required: true
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  java-distribution:
    description: 'Java distribution to use'
    required: false
    default: 'temurin'
  maven-command:
    description: 'Maven command to run tests'
    required: false
    default: './mvnw clean verify'

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    # Restore only.  This action consumes the repository built by the build-cache action;
    # it never needs to write.  Saving here would either duplicate the entry build-cache
    # already wrote in this repository's CI, or add an entry to debezium/debezium's cache
    # quota when this action is driven from there.
    #
    # No restore-keys on purpose.  In this repository's CI the exact key always hits,
    # because the build_cache job has just saved it.  When driven from debezium/debezium
    # this action shares a job with build-cache, so the repository is already populated
    # and a miss is correct: a prefix match there would extract a stale platform cache
    # over dependencies that were just restored.
    - name: Restore Maven Repository
      id: cache-check
      uses: actions/cache/restore@v5
      with:
        path: ~/.m2/repository
        key: ${{ inputs.cache-key }}

    - name: Install Ansible
      shell: bash
      run: |
        pip3 install ansible
        ansible-galaxy collection install community.docker
        ansible --version

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.maven-command }}
