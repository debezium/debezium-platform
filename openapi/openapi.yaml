---
openapi: 3.1.0
tags:
- name: Alerting
- name: Monitoring
  description: Pipeline monitoring and metrics
- name: connections
- name: destinations
- name: pipelines
- name: sources
- name: transforms
- name: vaults
components:
  schemas:
    ActiveAlertResponse:
      type: object
      properties:
        ruleId:
          type: integer
          format: int64
        ruleName:
          type: string
        pipelineId:
          type: string
        state:
          $ref: "#/components/schemas/AlertStateValue"
        severity:
          $ref: "#/components/schemas/Severity"
        value:
          type: number
          format: double
        threshold:
          type: number
          format: double
        since:
          $ref: "#/components/schemas/Instant"
    AlertEventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int64
        ruleName:
          type: string
        pipelineId:
          type: string
        pipelineName:
          type: string
        status:
          type: string
        value:
          type: number
          format: double
        threshold:
          type: number
          format: double
        severity:
          $ref: "#/components/schemas/Severity"
        message:
          type: string
        firedAt:
          $ref: "#/components/schemas/Instant"
        resolvedAt:
          $ref: "#/components/schemas/Instant"
        durationSeconds:
          type: integer
          format: int64
        createdAt:
          $ref: "#/components/schemas/Instant"
    AlertRuleRequest:
      type: object
      required:
      - name
      - panelId
      - operator
      - threshold
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        panelId:
          type: string
          minLength: 1
        operator:
          $ref: "#/components/schemas/Operator"
        threshold:
          type: number
          format: double
        forDuration:
          description: "ISO-8601 duration for how long the condition must hold before\
            \ firing. Default: PT0S (immediate). Max: PT1H"
          type: string
          examples:
          - PT5M
          $ref: "#/components/schemas/Duration"
        reduceFunction:
          $ref: "#/components/schemas/ReduceFunction"
        evaluationWindow:
          description: "ISO-8601 duration for the evaluation window used with reduce\
            \ functions other than LAST. Default: PT5M. Range: PT1M to PT1H"
          type: string
          examples:
          - PT5M
          $ref: "#/components/schemas/Duration"
        severity:
          $ref: "#/components/schemas/Severity"
        enabled:
          type: boolean
        channelIds:
          type: array
          items:
            type: integer
            format: int64
    AlertRuleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        panelId:
          type: string
        panelTitle:
          type: string
        operator:
          $ref: "#/components/schemas/Operator"
        threshold:
          type: number
          format: double
        forDuration:
          description: ISO-8601 duration for how long the condition must hold before
            firing
          type: string
          examples:
          - PT5M
          $ref: "#/components/schemas/Duration"
        reduceFunction:
          $ref: "#/components/schemas/ReduceFunction"
        evaluationWindow:
          description: ISO-8601 duration for the evaluation window
          type: string
          examples:
          - PT5M
          $ref: "#/components/schemas/Duration"
        severity:
          $ref: "#/components/schemas/Severity"
        enabled:
          type: boolean
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSummary"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    AlertStateValue:
      type: string
      enum:
      - OK
      - PENDING
      - FIRING
    AlertStatusResponse:
      type: object
      properties:
        totalFiring:
          type: integer
          format: int32
        totalPending:
          type: integer
          format: int32
        firingBySeverity:
          type: object
          additionalProperties:
            type: integer
            format: int32
        activeAlerts:
          type: array
          items:
            $ref: "#/components/schemas/ActiveAlertResponse"
    CatalogNode:
      type: object
      properties:
        name:
          type: string
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaNode"
        totalCollections:
          type: integer
          format: int32
    ChannelSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: "#/components/schemas/ChannelType"
    ChannelType:
      type: string
      enum:
      - EMAIL
      - WEBHOOK
    CollectionNode:
      type: object
      properties:
        name:
          type: string
        fullyQualifiedName:
          type: string
    ConnectionRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        type:
          $ref: "#/components/schemas/Type"
        config:
          type: object
          additionalProperties: {}
    ConnectionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/Type"
        config:
          type: object
          additionalProperties: {}
    DestinationRequest:
      type: object
      required:
      - name
      - type
      - schema
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          minLength: 1
        schema:
          type: string
          minLength: 1
        connection:
          $ref: "#/components/schemas/NamedRef"
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
    DestinationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
        schema:
          type: string
        connection:
          $ref: "#/components/schemas/NamedRef"
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
    Duration:
      type: string
      format: duration
      examples:
      - P1D
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    Metadata:
      type: object
      properties:
        queryDurationMs:
          type: integer
          format: int64
    NamedRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    NotificationChannelRequest:
      type: object
      required:
      - name
      - type
      - config
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ChannelType"
        config:
          type: object
          additionalProperties: {}
        enabled:
          type: boolean
    NotificationChannelResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: "#/components/schemas/ChannelType"
        config:
          type: object
          additionalProperties: {}
        enabled:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    Operator:
      type: string
      enum:
      - GREATER_THAN
      - GREATER_THAN_OR_EQUAL
      - LESS_THAN
      - LESS_THAN_OR_EQUAL
      - EQUAL
      - NOT_EQUAL
    PagedAlertEventResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AlertEventResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PanelQueryResponse:
      type: object
      properties:
        panelId:
          type: string
        pipelineId:
          type: string
        timeRange:
          $ref: "#/components/schemas/TimeRange"
        series:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeries"
        metadata:
          $ref: "#/components/schemas/Metadata"
    PanelResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        unit:
          type: string
        visualization:
          $ref: "#/components/schemas/Visualization"
    PanelsListResponse:
      type: object
      properties:
        panels:
          type: array
          items:
            $ref: "#/components/schemas/PanelResponse"
    PipelineRequest:
      type: object
      required:
      - name
      - source
      - destination
      - logLevel
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        source:
          $ref: "#/components/schemas/NamedRef"
        destination:
          $ref: "#/components/schemas/NamedRef"
        transforms:
          type: array
          items:
            $ref: "#/components/schemas/NamedRef"
        logLevel:
          type: string
          minLength: 1
        logLevels:
          type: object
          additionalProperties:
            type: string
    PipelineResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        source:
          $ref: "#/components/schemas/NamedRef"
        destination:
          $ref: "#/components/schemas/NamedRef"
        transforms:
          type: array
          items:
            $ref: "#/components/schemas/NamedRef"
        logLevel:
          type: string
        logLevels:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/PipelineStatus"
        errorMessage:
          type: string
    PipelineStatus:
      type: string
      enum:
      - DEPLOYING
      - RUNNING
      - STOPPED
      - FAILED
    PipelineUpdateRequest:
      type: object
      required:
      - name
      - logLevel
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        transforms:
          type: array
          items:
            $ref: "#/components/schemas/NamedRef"
        logLevel:
          type: string
          minLength: 1
        logLevels:
          type: object
          additionalProperties:
            type: string
    PredicateDto:
      type: object
      properties:
        type:
          type: string
        config:
          type: object
          additionalProperties: {}
        negate:
          type: boolean
    ReduceFunction:
      type: string
      enum:
      - LAST
      - AVG
      - MIN
      - MAX
      - SUM
    SchemaNode:
      type: object
      properties:
        name:
          type: string
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionNode"
        collectionCount:
          type: integer
          format: int32
    Severity:
      type: string
      enum:
      - CRITICAL
      - WARNING
      - INFO
    Signal:
      type: object
      properties:
        id:
          type: string
    SignalCollectionVerifyRequest:
      type: object
      properties:
        connectionId:
          type: integer
          format: int64
        fullyQualifiedTableName:
          type: string
    SignalRequest:
      type: object
      required:
      - id
      - type
      - data
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        data:
          type: string
          minLength: 1
        additionalData:
          type: object
          additionalProperties: {}
    SignalResponse:
      type: object
      properties:
        signal:
          $ref: "#/components/schemas/Signal"
    SourceRequest:
      type: object
      required:
      - name
      - type
      - schema
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          minLength: 1
        schema:
          type: string
          minLength: 1
        connection:
          $ref: "#/components/schemas/NamedRef"
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
    SourceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
        schema:
          type: string
        connection:
          $ref: "#/components/schemas/NamedRef"
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
    TimeRange:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
        step:
          type: string
    TimeSeries:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        datapoints:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
    TransformRequest:
      type: object
      required:
      - name
      - type
      - schema
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        type:
          type: string
          minLength: 1
        schema:
          type: string
          minLength: 1
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
        predicate:
          $ref: "#/components/schemas/PredicateDto"
    TransformResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
        schema:
          type: string
        vaults:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NamedRef"
        config:
          type: object
          additionalProperties: {}
        predicate:
          $ref: "#/components/schemas/PredicateDto"
    Type:
      type: string
      enum:
      - ORACLE
      - MYSQL
      - MARIADB
      - SQLSERVER
      - POSTGRESQL
      - MONGODB
      - KAFKA
      - REDIS
      - KINESIS
      - PUBSUB
      - HTTP
      - PULSAR
      - EVENTHUBS
      - NATS-STREAMING
      - NATS-JETSTREAM
      - PRAVEGA
      - INFINISPAN
      - ROCKETMQ
      - RABBITMQ
      - RABBITMQ_NATIVE_STREAM
      - MILVUS
      - QDRANT
      - SQS
      - JDBC
    VaultRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        plaintext:
          type: boolean
        items:
          type: object
          additionalProperties:
            type: string
    VaultResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        plaintext:
          type: boolean
        items:
          type: object
          additionalProperties:
            type: string
    Visualization:
      type: object
      properties:
        type:
          type: string
        suggestedStep:
          type: string
  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.invalid/realms/none/.well-known/openid-configuration
      description: Authentication
paths:
  /api/alerts/channels:
    post:
      summary: Creates a new notification channel
      tags:
      - Alerting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "400":
          description: Bad Request
    get:
      summary: Returns all available notification channels
      tags:
      - Alerting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannelResponse"
  /api/alerts/channels/{id}:
    put:
      summary: Updates an existing notification channel
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
        "400":
          description: Bad Request
    get:
      summary: Returns a notification channel with given id
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelResponse"
    delete:
      summary: Deletes an existing notification channel
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204": {}
  /api/alerts/events:
    get:
      summary: Returns paginated alert events
      tags:
      - Alerting
      parameters:
      - name: from
        in: query
        schema:
          $ref: "#/components/schemas/Instant"
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: pipelineId
        in: query
        schema:
          type: string
      - name: ruleId
        in: query
        schema:
          type: integer
          format: int64
      - name: severity
        in: query
        schema:
          $ref: "#/components/schemas/Severity"
      - name: size
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 20
      - name: status
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          $ref: "#/components/schemas/Instant"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAlertEventResponse"
  /api/alerts/events/{id}:
    get:
      summary: Returns a single alert event by id
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventResponse"
  /api/alerts/rules:
    post:
      summary: Creates a new alert rule
      tags:
      - Alerting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Bad Request
    get:
      summary: Returns all available alert rules
      tags:
      - Alerting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRuleResponse"
  /api/alerts/rules/{id}:
    put:
      summary: Updates an existing alert rule
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
        "400":
          description: Bad Request
    get:
      summary: Returns an alert rule with given id
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
    delete:
      summary: Deletes an existing alert rule
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204": {}
  /api/alerts/rules/{id}/disable:
    put:
      summary: Disables an alert rule
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
  /api/alerts/rules/{id}/enable:
    put:
      summary: Enables an alert rule
      tags:
      - Alerting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleResponse"
  /api/alerts/status:
    get:
      summary: Returns current alert status summary
      tags:
      - Alerting
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertStatusResponse"
  /api/catalog:
    get:
      summary: Returns all available components for the current application version
      parameters:
      - name: type
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
      tags:
      - Catalog Resource
  /api/catalog/{type}/{class}:
    get:
      summary: Returns descriptors for a specific component using current application
        version
      parameters:
      - name: class
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
      tags:
      - Catalog Resource
  /api/catalog/{version}:
    get:
      summary: Returns all available components for a specific version
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
      tags:
      - Catalog Resource
  /api/catalog/{version}/{type}/{class}:
    get:
      summary: Returns descriptors for a specific component
      parameters:
      - name: class
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
      tags:
      - Catalog Resource
  /api/connections:
    post:
      summary: Creates new connection
      tags:
      - connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: string
                format: uri
        "400":
          description: Bad Request
    get:
      summary: Returns all available connections
      tags:
      - connections
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionResponse"
  /api/connections/schemas:
