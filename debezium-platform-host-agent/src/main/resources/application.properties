# Debezium Host Agent — default configuration
#
# This agent is deployed on each remote host by the Ansible provisioning
# playbook. It receives REST calls from the Conductor and translates them
# into Docker CLI commands.

# HTTP server port — matches the Conductor's HostConfigGroup.agentPort() default
quarkus.http.port=8090
quarkus.http.host=0.0.0.0

# Bearer token for request authentication.
# Set via AGENT_TOKEN env var in the systemd unit file during provisioning.
agent.token=${AGENT_TOKEN:}

# Base paths for config and data — match the Conductor's HostConfigGroup defaults
agent.config-base-path=/opt/debezium/configs
agent.data-base-path=/opt/debezium/data

# Application name for logging
quarkus.application.name=debezium-host-agent
